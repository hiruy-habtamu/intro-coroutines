kotlin.code.style=official
# 1. Keep the engine running (prevents JVM startup lag)
org.gradle.daemon=true

# 2. Run independent tasks at the same time
org.gradle.parallel=true

# 3. Reuse results from previous builds (even after a 'clean')
org.gradle.caching=true

# 4. Skip the 'thinking' phase if nothing changed (HUGE speed boost)
org.gradle.configuration-cache=true

# 5. Give it more "brain power" (RAM)
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC